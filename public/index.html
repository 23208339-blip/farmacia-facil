<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmácia Fácil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .visually-hidden-focusable {
      position: absolute;
      left: -9999px;
      top: 0;
      background: #000;
      color: #fff;
      padding: 12px 16px;
      z-index: 1000;
    }
    .visually-hidden-focusable:focus {
      left: 8px;
      top: 8px;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
    }
    :focus-visible {
      outline: 3px solid #0d6efd;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <a href="#conteudo-principal" class="visually-hidden-focusable">Pular para o conteúdo principal</a>

  <header class="container py-4">
    <h1>Farmácia Fácil</h1>
    <p>Organize seus medicamentos e horários com facilidade.</p>
  </header>

  <main class="container" id="conteudo-principal">
    <form id="form-medicamento" aria-label="Cadastrar medicamento" class="mb-4" novalidate>
      <div class="mb-3">
        <label for="nome" class="form-label">
          Nome do medicamento <span aria-hidden="true">*</span>
          <span class="visually-hidden">(obrigatório)</span>
        </label>
        <input type="text" id="nome" name="nome" class="form-control" required aria-describedby="erro-nome">
        <div id="erro-nome" class="invalid-feedback" role="alert"></div>
      </div>

      <div class="mb-3">
        <label for="dosagem" class="form-label">Dosagem</label>
        <input type="text" id="dosagem" name="dosagem" class="form-control" placeholder="Ex: 500mg" aria-describedby="ajuda-dosagem">
        <div id="ajuda-dosagem" class="form-text">Opcional. Exemplo: 500mg, 1 comprimido.</div>
      </div>

      <div class="mb-3">
        <label for="horario" class="form-label">
          Horário <span aria-hidden="true">*</span>
          <span class="visually-hidden">(obrigatório)</span>
        </label>
        <input type="time" id="horario" name="horario" class="form-control" required aria-describedby="erro-horario">
        <div id="erro-horario" class="invalid-feedback" role="alert"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg">Cadastrar medicamento</button>
    </form>

    <h2>Meus medicamentos</h2>
    <section id="lista-medicamentos" aria-live="polite" aria-atomic="true"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
