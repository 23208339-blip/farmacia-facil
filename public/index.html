<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmácia Fácil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <header class="container py-4">
    <h1>Farmácia Fácil</h1>
    <p>Organize seus medicamentos e horários com facilidade.</p>
  </header>

  <main class="container">
    <form id="form-medicamento" aria-label="Cadastrar medicamento" class="mb-4">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome do medicamento</label>
        <input type="text" id="nome" name="nome" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="dosagem" class="form-label">Dosagem</label>
        <input type="text" id="dosagem" name="dosagem" class="form-control" placeholder="Ex: 500mg">
      </div>

      <div class="mb-3">
        <label for="horario" class="form-label">Horário</label>
        <input type="time" id="horario" name="horario" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>

    <h2>Meus medicamentos</h2>
    <section id="lista-medicamentos" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
